<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 200px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f9;
            color: #333;
        }
        h2 {
            font-size: 18px;
            margin-top: 0;
            color: #e63946;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #1d3557;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #457b9d;
        }
        .status {
            font-size: 12px;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <h2>AlphaApple</h2>
    <button id="solveBtn" class="btn">Find Best Move</button>
    <div id="status" class="status">Click to solve current board</div>
    <script src="popup.js"></script>
</body>
</html>
